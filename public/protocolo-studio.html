              )}
            </div>
            {aiError && (
              <div style={{ fontSize: 11, color: "#e11d48", background: "rgba(255,241,242,0.8)", borderRadius: 10, padding: "8px 10px", marginBottom: 10 }}>⚠ {aiError}</div>
            )}
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
              <button onClick={() => setAiOpen(false)} disabled={aiLoading}
                style={{ padding: "9px 16px", borderRadius: 10, border: "none", fontSize: 12.5, fontWeight: 600, color: "#64748b", background: "#f1f5f9", cursor: aiLoading ? "default" : "pointer" }}>
                Cancelar
              </button>
              <button onClick={handleAiGenerate} disabled={aiLoading || (!aiText.trim() && !aiPdfFile)}
                style={{ padding: "9px 18px", borderRadius: 10, border: "none", fontSize: 12.5, fontWeight: 700, color: "#fff", cursor: aiLoading || (!aiText.trim() && !aiPdfFile) ? "default" : "pointer",
                  background: aiLoading || (!aiText.trim() && !aiPdfFile) ? "#c4b5fd" : "linear-gradient(135deg,#c084fc,#7c3aed)" }}>
                {aiLoading ? "Gerando…" : "Gerar fluxo"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function NodeCorners({ node, s, connecting, snapTarget, hoveredArrow, setHoveredArrow, startConnection }) {
  const handles = handlesForNode(node);
  if (handles.length === 1) {
    const h = handles[0];
    return (
      <OutputChevron center s={s} node={node} h={h} keyId={`${node.id}:${h.id ?? "default"}`}
        connecting={connecting} snapTarget={snapTarget} hoveredArrow={hoveredArrow}
        setHoveredArrow={setHoveredArrow} startConnection={startConnection} />
    );
  }
  return (
    <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, display: "flex", justifyContent: "space-between", padding: "0 20px" }}>
      {handles.map((h) => (
        <OutputChevron key={h.id} inline s={s} node={node} h={h} keyId={`${node.id}:${h.id}`}
          connecting={connecting} snapTarget={snapTarget} hoveredArrow={hoveredArrow}
          setHoveredArrow={setHoveredArrow} startConnection={startConnection} />
      ))}
    </div>
  );
}

// Chevron discreto centralizado na borda inferior — só o desenho em repouso,
// levemente translúcido. Ativo (hover / conectando / alvo do ímã): vira um
// círculo com o gradiente azul por trás, um pouco maior.
function OutputChevron({ center, inline, s, node, h, keyId, connecting, snapTarget, hoveredArrow, setHoveredArrow, startConnection }) {
  const isConnectingFrom = connecting?.from === node.id && connecting?.fromHandle === h.id;
  const isSnapTarget = snapTarget && snapTarget.nodeId === node.id && snapTarget.handleId === h.id;
  const isHovered = hoveredArrow === keyId;
  const active = isConnectingFrom || isSnapTarget || isHovered;
  const size = active ? 34 : 20;
  const posStyle = center
    ? { position: "absolute", left: "50%", bottom: 0, transform: "translate(-50%, 45%)" }
    : { position: "relative", transform: "translateY(45%)" };
  return (
    <div data-arrow="1" title={h.label}
      onMouseDown={(e) => startConnection(e, node, h.id)}
      onMouseEnter={() => setHoveredArrow(keyId)}
      onMouseLeave={() => setHoveredArrow((cur) => (cur === keyId ? null : cur))}
      style={{ ...posStyle, width: size, height: size, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "crosshair", zIndex: 5, background: active ? SNAP_GRAD : "transparent",
        boxShadow: active ? "0 6px 14px rgba(37,99,235,0.38)" : "none", opacity: active ? 1 : 0.62, transition: "all .15s" }}>
      <ChevronDown size={active ? 18 : 15} color={active ? "#fff" : s.accent} strokeWidth={2.8} />
    </div>
  );
}

function FloatingButton({ item, style: s, offset, size, iconSize, muted, onDragStart, onDragEnd, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <div draggable onDragStart={onDragStart} onDragEnd={onDragEnd} onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ position: "relative", marginLeft: offset, width: size, height: size, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
        cursor: "grab", transition: "transform .15s, box-shadow .15s", transform: hover ? "scale(1.1)" : "scale(1)", opacity: muted ? 0.88 : 1,
        ...glass({ boxShadow: hover ? "0 10px 26px rgba(100,90,140,0.28)" : "0 6px 18px rgba(100,90,140,0.18)" }) }}>
      <div style={{ width: iconSize, height: iconSize, borderRadius: "50%", background: s.grad, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "inset 0 1px 2px rgba(255,255,255,0.4)" }}>
        <s.Icon size={Math.round(iconSize * 0.44)} color="#fff" strokeWidth={2.3} />
      </div>
      {hover && (
        <span style={{ position: "absolute", left: size + 10, top: "50%", transform: "translateY(-50%)", whiteSpace: "nowrap",
          background: "rgba(30,41,59,0.92)", color: "#fff", fontSize: 11, fontWeight: 500, padding: "5px 10px", borderRadius: 8, boxShadow: "0 6px 16px rgba(0,0,0,.2)", pointerEvents: "none" }}>
          {item.label}
        </span>
      )}
    </div>
  );
}

const EVENTO_ACOES = [
  { id: "suspender", label: "Suspender", alvoTipo: ["Medicamento", "Exame", "Consulta"] },
  { id: "ajustar", label: "Ajustar dose", alvoTipo: ["Medicamento"] },
  { id: "mensagem_paciente", label: "Enviar mensagem ao paciente", alvoTipo: null },
  { id: "notificar_usuario", label: "Notificar usuário", alvoTipo: null },
  { id: "gerar_receita", label: "Gerar receita", alvoTipo: ["Medicamento"] },
  { id: "enviar_receita", label: "Enviar receita", alvoTipo: ["Medicamento"] },
  { id: "solicitar_exame", label: "Solicitar exame", alvoTipo: ["Exame"] },
];
function eventoResumo(node, nodesById) {
  const alvoNome = nodesById[node.alvoId]?.name;
  switch (node.acao) {
    case "suspender": return <>Suspende <b>{alvoNome || "(alvo não definido)"}</b></>;
    case "ajustar": return <>Ajusta <b>{alvoNome || "(alvo não definido)"}</b></>;
    case "gerar_receita": return <>Gera receita de <b>{alvoNome || "(alvo não definido)"}</b></>;
    case "enviar_receita": return <>Envia receita de <b>{alvoNome || "(alvo não definido)"}</b></>;
    case "solicitar_exame": return <>Solicita <b>{alvoNome || "(exame não definido)"}</b></>;
    case "mensagem_paciente": return <>Envia mensagem ao paciente{node.conteudo ? <>: <b>"{node.conteudo.slice(0, 40)}{node.conteudo.length > 40 ? "…" : ""}"</b></> : null}</>;
    case "notificar_usuario": return <>Notifica <b>{node.destinatario || "(destinatário não definido)"}</b></>;
    default: return "(efeito não definido)";
  }
}

function NodeInspector({ node, graph, fontes, onChange }) {
  const s = TYPE_STYLE[node.type];
  const label = { fontSize: 10.5, fontWeight: 700, color: "#64748b", textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 4, display: "block" };
  const input = { width: "100%", fontSize: 12.5, padding: "8px 10px", borderRadius: 10, border: "1px solid #dbe1ea", marginBottom: 12, boxSizing: "border-box", background: "rgba(255,255,255,0.85)", outline: "none" };
  const nodesById = useMemo(() => Object.fromEntries(graph.nodes.map((n) => [n.id, n])), [graph.nodes]);

  // Busca ao vivo no catálogo (TUSS / substâncias) — chamados incondicionalmente
  // (regra dos hooks), mesmo que o nó não seja Exame/Medicamento; o componente é
  // remontado por node.id (ver key no <NodeInspector> pai), então o estado de
  // busca começa limpo a cada nó selecionado.
  const [tussQuery, setTussQuery] = useState(node.tussId ? node.name : "");
  const tussSearch = useDebouncedSearch(tussQuery, buscarTussApi);
  const [subQuery, setSubQuery] = useState(node.substanciaId ? node.name : "");
  const subSearch = useDebouncedSearch(subQuery, buscarSubstanciaApi);

  function addBranch() {
    const branches = [...node.branches];
    branches.splice(branches.length - 1, 0, { id: uid(), descricao: "", clauses: [] });
    onChange({ branches });
  }
  const updateBranch = (id, patch) => onChange({ branches: node.branches.map((b) => (b.id === id ? { ...b, ...patch } : b)) });
  const removeBranch = (id) => onChange({ branches: node.branches.filter((b) => b.id !== id) });

  function makeClause(sourceKind, sourceNodeId, conector) {
    if (sourceKind === "medicamento") return { id: uid(), sourceKind, sourceNodeId, estado: "em_uso", conector };
    if (sourceKind === "paciente") return { id: uid(), sourceKind, sourceNodeId: null, variavel: "idade", operador: "maior_que", valor: "", conector };
    return { id: uid(), sourceKind: "exame", sourceNodeId, campo: "numero", operador: "maior_que", numero: "", conector };
  }
  function addClause(branchId, sourceKind, sourceNodeId) {
    const branch = node.branches.find((b) => b.id === branchId);
    const conector = branch.clauses.length === 0 ? null : "E";
    updateBranch(branchId, { clauses: [...branch.clauses, makeClause(sourceKind, sourceNodeId, conector)] });
  }
  function updateClause(branchId, clauseId, patch) {
    const branch = node.branches.find((b) => b.id === branchId);
    updateBranch(branchId, { clauses: branch.clauses.map((c) => (c.id === clauseId ? { ...c, ...patch } : c)) });
  }
  function removeClause(branchId, clauseId) {
    const branch = node.branches.find((b) => b.id === branchId);
    const clauses = branch.clauses.filter((c) => c.id !== clauseId);
    if (clauses.length) clauses[0] = { ...clauses[0], conector: null }; // a primeira nunca tem conector
    updateBranch(branchId, { clauses });
  }

  const outrosNos = graph.nodes.filter((n) => n.id !== node.id && ["Medicamento", "Exame", "Consulta"].includes(n.type));

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
        <div style={{ width: 32, height: 32, borderRadius: "50%", background: s.grad, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <s.Icon size={16} color="#fff" strokeWidth={2.3} />
        </div>
        <div style={{ fontSize: 11.5, fontWeight: 700, color: s.accent, textTransform: "uppercase", letterSpacing: 0.4 }}>{s.label}</div>
      </div>

      <label style={label}>Nome do nó</label>
      <input style={input} value={node.name} onChange={(e) => onChange({ name: e.target.value })} />

      {node.type === "Exame" && (
        <>
          <label style={label}>Procedimento (catálogo TUSS)</label>
          <input style={input} list="tuss-list" value={tussQuery}
            onChange={(e) => {
              const v = e.target.value; setTussQuery(v);
              const hit = tussSearch.results.find((t) => t.nome === v);
              onChange(hit ? { tussId: hit.id, name: hit.nome } : { tussId: null, name: v });
            }}
            placeholder="Buscar exame no catálogo TUSS..." />
          <datalist id="tuss-list">{tussSearch.results.map((t) => <option key={t.id} value={t.nome} />)}</datalist>
          {tussSearch.loading && <div style={{ fontSize: 10.5, color: "#94a3b8", marginTop: -8, marginBottom: 12 }}>Buscando…</div>}
          {node.tussId && <div style={{ fontSize: 10.5, color: "#059669", marginTop: -8, marginBottom: 12 }}>TUSS {tussSearch.results.find((t) => t.id === node.tussId)?.codigo || ""} — vinculado</div>}
          {!node.tussId && tussQuery.trim().length >= 2 && !tussSearch.loading && <div style={{ fontSize: 10.5, color: "#d97706", marginTop: -8, marginBottom: 12 }}>Não vinculado ao catálogo — escolha uma opção da lista</div>}
        </>
      )}
      {node.type === "Consulta" && (<><label style={label}>Especialidade (opcional)</label><input style={input} value={node.especialidade || ""} onChange={(e) => onChange({ especialidade: e.target.value })} /></>)}
      {node.type === "Medicamento" && (
        <>
          <label style={label}>Substância (catálogo)</label>
          <input style={input} list="sub-list" value={subQuery}
            onChange={(e) => {
              const v = e.target.value; setSubQuery(v);
              const hit = subSearch.results.find((s2) => s2.nome === v);
              onChange(hit ? { substanciaId: hit.id, name: hit.nome } : { substanciaId: null, name: v });
            }}
            placeholder="Buscar substância..." />
          <datalist id="sub-list">{subSearch.results.map((s2) => <option key={s2.id} value={s2.nome} />)}</datalist>
          {subSearch.loading && <div style={{ fontSize: 10.5, color: "#94a3b8", marginTop: -8, marginBottom: 12 }}>Buscando…</div>}
          {node.substanciaId && <div style={{ fontSize: 10.5, color: "#059669", marginTop: -8, marginBottom: 12 }}>Vinculado ao catálogo</div>}
          {!node.substanciaId && subQuery.trim().length >= 2 && !subSearch.loading && <div style={{ fontSize: 10.5, color: "#d97706", marginTop: -8, marginBottom: 12 }}>Não vinculado ao catálogo — escolha uma opção da lista</div>}
          <label style={label}>Dose</label>
          <input style={input} value={node.dose || ""} onChange={(e) => onChange({ dose: e.target.value })} placeholder="Ex: 75mcg" />
          <label style={label}>Posologia</label>
          <input style={input} value={node.posologia || ""} onChange={(e) => onChange({ posologia: e.target.value })} placeholder="Ex: 1x/dia" />
        </>
      )}

      {node.type === "Condicao" && (
        <>
          {!fontes.length && (
            <div style={{ fontSize: 10.5, padding: "8px 10px", borderRadius: 10, marginBottom: 12, color: "#b45309", background: "rgba(254,243,199,0.6)" }}>
              ⚠ Conecte um Exame ou Medicamento na entrada — cada cláusula usa um deles como fonte (além dos dados do paciente, sempre disponíveis).
            </div>
          )}

          <label style={label}>Fontes para montar cláusulas</label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>
            {fontes.map((f) => {
              const fs = TYPE_STYLE[f.type];
              return (
                <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10.5, fontWeight: 600, color: fs.accent, background: fs.soft, border: `1px solid ${fs.accent}33`, borderRadius: 999, padding: "4px 9px" }}>
                  <fs.Icon size={11} /> {f.name}
                </div>
              );
            })}
            <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10.5, fontWeight: 600, color: "#475569", background: "#f1f5f9", borderRadius: 999, padding: "4px 9px" }}>
              🧍 Dado do paciente
            </div>
          </div>
          <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 14, marginTop: -8 }}>
            Clique em "+ Cláusula" dentro de cada regra abaixo e escolha uma dessas fontes.
          </div>

          <label style={label}>Regras, em ordem (a primeira cuja cadeia de cláusulas bater decide o ramo)</label>
          {node.branches.map((b, i) => (
            <div key={b.id} style={{ borderRadius: 12, padding: 10, marginBottom: 8, border: `1px dashed ${b.isDefault ? "#cbd5e1" : "#fbbf24"}`, background: b.isDefault ? "rgba(248,250,252,0.6)" : "rgba(255,251,235,0.6)" }}>
              <div style={{ fontSize: 9.5, fontWeight: 700, color: "#94a3b8", marginBottom: 6 }}>{i + 1}. {b.isDefault ? "CASO PADRÃO (fallback)" : "REGRA"}</div>
              {!b.isDefault && (
                <>
                  {b.clauses.map((c) => (
                    <ClauseEditor key={c.id} clause={c} nodesById={nodesById}
                      onChange={(patch) => updateClause(b.id, c.id, patch)}
                      onRemove={() => removeClause(b.id, c.id)} inputStyle={input} />
                  ))}
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: b.clauses.length ? 4 : 0, marginBottom: 6 }}>
                    {fontes.map((f) => {
                      const fs = TYPE_STYLE[f.type];
                      return (
                        <button key={f.id} onClick={() => addClause(b.id, f.type === "Exame" ? "exame" : "medicamento", f.id)}
                          style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, fontWeight: 600, color: fs.accent, background: "#fff", border: `1px solid ${fs.accent}55`, borderRadius: 8, padding: "4px 8px", cursor: "pointer" }}>
                          <Plus size={10} /> {f.name}
                        </button>
                      );
                    })}
                    <button onClick={() => addClause(b.id, "paciente", null)}
                      style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, fontWeight: 600, color: "#475569", background: "#fff", border: "1px solid #cbd5e1", borderRadius: 8, padding: "4px 8px", cursor: "pointer" }}>
                      <Plus size={10} /> Dado do paciente
                    </button>
                  </div>
                  <button onClick={() => removeBranch(b.id)} style={{ fontSize: 10.5, color: "#e11d48", background: "none", border: "none", cursor: "pointer", padding: 0 }}>Remover regra</button>
                </>
              )}
            </div>
          ))}
          <button onClick={addBranch} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontSize: 11.5, fontWeight: 600, color: s.accent, background: s.soft, border: "none", borderRadius: 10, padding: "8px 10px", cursor: "pointer", marginBottom: 4 }}>
            <Plus size={13} /> Regra
          </button>
          <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 12 }}>
            ⚠ Compor cláusulas de mais de uma fonte (ex: exame E medicamento) ainda não é avaliado pelo motor real — precisa da migração que discutimos (condição com contexto completo do paciente).
          </div>
        </>
      )}

      {node.type === "Admissao" && (() => {
        const addAdmClause = (sourceKind, sourceNodeId) => {
          const conector = node.clauses.length === 0 ? null : "E";
          onChange({ clauses: [...node.clauses, makeClause(sourceKind, sourceNodeId, conector)] });
        };
        const updateAdmClause = (clauseId, patch) => onChange({ clauses: node.clauses.map((c) => (c.id === clauseId ? { ...c, ...patch } : c)) });
        const removeAdmClause = (clauseId) => {
          const clauses = node.clauses.filter((c) => c.id !== clauseId);
          if (clauses.length) clauses[0] = { ...clauses[0], conector: null };
          onChange({ clauses });
        };
        return (
          <>
            <div style={{ fontSize: 10.5, padding: "8px 10px", borderRadius: 10, marginBottom: 14, color: "#0f766e", background: "rgba(240,253,250,0.8)" }}>
              Portão de entrada do protocolo — só dados do paciente, avaliados antes de qualquer exame. Duas saídas fixas: <b>Admitido</b> e <b>Não admitido</b>.
            </div>

            <label style={label}>Critérios (cadeia E/OU)</label>
            {node.clauses.map((c) => (
              <ClauseEditor key={c.id} clause={c} nodesById={nodesById}
                onChange={(patch) => updateAdmClause(c.id, patch)}
                onRemove={() => removeAdmClause(c.id)} inputStyle={input} />
            ))}
            <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: node.clauses.length ? 4 : 0, marginBottom: 12 }}>
              {fontes.map((f) => {
                const fs = TYPE_STYLE[f.type];
                return (
                  <button key={f.id} onClick={() => addAdmClause(f.type === "Exame" ? "exame" : "medicamento", f.id)}
                    style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, fontWeight: 600, color: fs.accent, background: "#fff", border: `1px solid ${fs.accent}55`, borderRadius: 8, padding: "4px 8px", cursor: "pointer" }}>
                    <Plus size={10} /> {f.name}
                  </button>
                );
              })}
              <button onClick={() => addAdmClause("paciente", null)}
                style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, fontWeight: 600, color: "#475569", background: "#fff", border: "1px solid #cbd5e1", borderRadius: 8, padding: "4px 8px", cursor: "pointer" }}>
                <Plus size={10} /> Dado do paciente
              </button>
            </div>
            <div style={{ fontSize: 10, color: "#94a3b8", marginBottom: 12 }}>
              Conecte a saída <b>Admitido</b> ao restante do protocolo, e a <b>Não admitido</b> a um Evento explicando a recusa (ex: notificar usuário).
            </div>
          </>
        );
      })()}

      {node.type === "Evento" && (() => {
        const acaoAtual = EVENTO_ACOES.find((a) => a.id === node.acao) || EVENTO_ACOES[0];
        const precisaAlvo = !!acaoAtual.alvoTipo;
        const precisaMensagem = node.acao === "mensagem_paciente" || node.acao === "notificar_usuario";
        const alvosFiltrados = precisaAlvo ? outrosNos.filter((n) => acaoAtual.alvoTipo.includes(n.type)) : [];
        return (
          <>
            <label style={label}>Efeito</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
              {EVENTO_ACOES.map((op) => (
                <button key={op.id} onClick={() => onChange({ acao: op.id })}
                  style={{ flex: "1 1 calc(50% - 6px)", minWidth: 110, padding: "7px 6px", borderRadius: 10, border: "none", fontSize: 10.5, fontWeight: 700, cursor: "pointer", lineHeight: 1.25,
                    background: node.acao === op.id ? s.grad : "#f1f5f9", color: node.acao === op.id ? "#fff" : "#64748b" }}>{op.label}</button>
              ))}
            </div>

            {precisaAlvo && (
              <>
                <label style={label}>{node.acao === "solicitar_exame" ? "Exame alvo" : "Ação alvo"} (nó existente no fluxo)</label>
                <select style={input} value={node.alvoId || ""} onChange={(e) => onChange({ alvoId: e.target.value || null })}>
                  <option value="">Selecione…</option>
                  {alvosFiltrados.map((n) => <option key={n.id} value={n.id}>{n.name} ({TYPE_STYLE[n.type].label})</option>)}
                </select>
                {alvosFiltrados.length === 0 && (
                  <div style={{ fontSize: 10, color: "#b45309", marginTop: -8, marginBottom: 12 }}>
                    Nenhum nó de {acaoAtual.alvoTipo.join("/")} no fluxo ainda pra apontar como alvo.
                  </div>
                )}
              </>
            )}
            {node.acao === "ajustar" && (<><label style={label}>Novo valor / fator de ajuste</label><input style={input} value={node.fator || ""} onChange={(e) => onChange({ fator: e.target.value })} placeholder="Ex: 75mcg, ou fator 1.5" /></>)}

            {precisaMensagem && (
              <>
                {node.acao === "notificar_usuario" && (
                  <>
                    <label style={label}>Notificar (usuário/perfil)</label>
                    <input style={input} value={node.destinatario || ""} onChange={(e) => onChange({ destinatario: e.target.value })} placeholder="Ex: Médico responsável" />
                  </>
                )}
                <label style={label}>{node.acao === "mensagem_paciente" ? "Mensagem para o paciente" : "Mensagem da notificação"}</label>
                <textarea style={{ ...input, minHeight: 64, resize: "vertical", fontFamily: "inherit" }} value={node.conteudo || ""}
                  onChange={(e) => onChange({ conteudo: e.target.value })} placeholder="Escreva a mensagem..." />
              </>
            )}

            <label style={label}>Motivo (aparece na auditoria)</label>
            <input style={input} value={node.motivo || ""} onChange={(e) => onChange({ motivo: e.target.value })} placeholder="Ex: Gestação em curso" />
            <div style={{ fontSize: 10, color: "#e11d48", background: "rgba(255,241,242,0.7)", borderRadius: 10, padding: "8px 10px" }}>
              ⚠ Nenhum desses efeitos existe no schema ainda — hoje uma regra só cria tarefas novas. Essas opções descrevem a intenção; a execução real (suspender, mandar mensagem, gerar receita etc.) precisa ser construída na Fase 2.
            </div>
          </>
        );
      })()}

      {(() => {
        const incoming = graph.edges.filter((e) => e.to === node.id);
        if (!incoming.length) {
          return (
            <>
              <label style={{ ...label, marginTop: 12 }}>Lapso desde o início do protocolo (dias)</label>
              <input type="number" min={0} style={input} value={node.lapso} onChange={(e) => onChange({ lapso: Number(e.target.value) })} />
              <div style={{ fontSize: 10.5, color: "#94a3b8", marginTop: -6 }}>Este nó não tem entrada — é a raiz do protocolo (ou de um sub-fluxo), então o lapso conta a partir do início.</div>
            </>
          );
        }
        return (
          <>
            <label style={{ ...label, marginTop: 12 }}>Lapso desde o(s) nó(s) anterior(es)</label>
            <div style={{ borderRadius: 10, background: "rgba(241,245,249,0.7)", padding: "8px 10px", marginBottom: 4 }}>
              {incoming.map((e) => {
                const from = graph.nodes.find((n) => n.id === e.from);
                return <div key={e.id} style={{ fontSize: 11, color: "#475569" }}>{from?.name || "?"} → <b>{e.lapso}d</b></div>;
              })}
            </div>
            <div style={{ fontSize: 10.5, color: "#94a3b8" }}>Definido na(s) linha(s) de conexão, não aqui — edite direto no badge da linha, no canvas.</div>
          </>
        );
      })()}
    </div>
  );
}

// Uma cláusula dentro da cadeia de uma regra: opcionalmente um alternador E/OU
// (ausente na primeira cláusula), a fonte de onde ela vem (badge fixo, não editável
// depois de criada), e os campos específicos daquele tipo de fonte.
function ClauseEditor({ clause, nodesById, onChange, onRemove, inputStyle }) {
  const srcNode = clause.sourceNodeId ? nodesById[clause.sourceNodeId] : null;
  const srcStyle = srcNode ? TYPE_STYLE[srcNode.type] : null;
  const smallInput = { ...inputStyle, marginBottom: 0, padding: "6px 8px", fontSize: 11.5 };

  return (
    <div style={{ borderRadius: 10, padding: 8, marginBottom: 6, background: "rgba(255,255,255,0.6)", border: "1px solid rgba(203,213,225,0.7)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, flexWrap: "wrap" }}>
        {clause.conector !== null && (
          <div style={{ display: "flex", gap: 3 }}>
            {["E", "OU"].map((op) => (
              <button key={op} onClick={() => onChange({ conector: op })}
                style={{ padding: "2px 8px", borderRadius: 6, border: "none", fontSize: 10, fontWeight: 700, cursor: "pointer",
                  background: clause.conector === op ? "#1e293b" : "#e2e8f0", color: clause.conector === op ? "#fff" : "#64748b" }}>
                {op}
              </button>
            ))}
          </div>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 10, fontWeight: 700,
          color: clause.sourceKind === "paciente" ? "#475569" : srcStyle?.accent,
          background: clause.sourceKind === "paciente" ? "#f1f5f9" : srcStyle?.soft, borderRadius: 999, padding: "2px 8px" }}>
          {clause.sourceKind === "paciente" ? "🧍 Paciente" : `${srcStyle?.label}: ${srcNode?.name || "?"}`}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={onRemove} style={{ border: "none", background: "none", color: "#cbd5e1", cursor: "pointer", padding: 0, display: "flex" }}><X size={13} /></button>
      </div>

      {clause.sourceKind === "medicamento" && (
        <select style={smallInput} value={clause.estado} onChange={(e) => onChange({ estado: e.target.value })}>
          <option value="em_uso">está em uso</option>
          <option value="suspenso">está suspenso</option>
        </select>
      )}

      {clause.sourceKind === "exame" && (
        <>
          <select style={{ ...smallInput, width: "100%", marginBottom: 6 }} value={clause.campo} onChange={(e) => onChange({ campo: e.target.value })}>
            {CAMPO_OPTIONS.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
          {clause.campo === "achado" ? (
            <div style={{ display: "flex", gap: 6 }}>
              <input style={{ ...smallInput, flex: 1 }} value={clause.conceito || ""} onChange={(e) => onChange({ conceito: e.target.value })} placeholder="Ex: FIBRILACAO_ATRIAL" />
              <select style={{ ...smallInput, width: 90 }} value={String(clause.presente ?? true)} onChange={(e) => onChange({ presente: e.target.value === "true" })}>
                <option value="true">presente</option><option value="false">ausente</option>
              </select>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 6 }}>
              <select style={{ ...smallInput, flex: 1 }} value={clause.operador} onChange={(e) => onChange({ operador: e.target.value })}>
                {(clause.campo === "numero" ? OPERADORES_NUMERO : OPERADORES_TEXTO).map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}
              </select>
              {clause.operador === "entre" ? (
                <>
                  <input style={{ ...smallInput, width: 56 }} value={clause.numero_min || ""} onChange={(e) => onChange({ numero_min: e.target.value })} placeholder="min" />
                  <input style={{ ...smallInput, width: 56 }} value={clause.numero_max || ""} onChange={(e) => onChange({ numero_max: e.target.value })} placeholder="max" />
                </>
              ) : (
                <input style={{ ...smallInput, flex: 1 }} value={clause.campo === "numero" ? (clause.numero || "") : (clause.texto || "")}
                  onChange={(e) => onChange(clause.campo === "numero" ? { numero: e.target.value } : { texto: e.target.value })} placeholder="Valor" />
              )}
            </div>
          )}
        </>
      )}

      {clause.sourceKind === "paciente" && (() => {
        const v = PATIENT_VARS.find((p) => p.id === clause.variavel);
        const ops = v?.kind === "numero" ? OPERADORES_NUMERO : v?.kind === "texto" ? OPERADORES_TEXTO : OPERADORES_ENUM;
        return (
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <select style={{ ...smallInput, flex: 1, minWidth: 90 }} value={clause.variavel}
              onChange={(e) => onChange({ variavel: e.target.value, operador: "igual", valor: "" })}>
              {PATIENT_VARS.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
            </select>
            <select style={{ ...smallInput, width: 84 }} value={clause.operador} onChange={(e) => onChange({ operador: e.target.value })}>
              {ops.map((o) => <option key={o.id} value={o.id}>{o.label}</option>)}
            </select>
            {v?.kind === "enum" ? (
              <select style={{ ...smallInput, width: 80 }} value={clause.valor} onChange={(e) => onChange({ valor: e.target.value })}>
                <option value="">—</option>
                {v.options.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            ) : (
              <input style={{ ...smallInput, width: 80 }} value={clause.valor} onChange={(e) => onChange({ valor: e.target.value })} placeholder="Valor" />
            )}
          </div>
        );
      })()}
    </div>
  );
}


// Gate de autenticação. Se a sessão do Supabase do app principal já estiver
// em localStorage (mesmo domínio, produção — ver comentário no <head>), isso
// nem aparece: o useEffect abaixo já encontra a sessão de cara. Só mostra o
// formulário se realmente não houver sessão.
function App() {
  const [session, setSession] = useState(undefined); // undefined = carregando
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState(null);
  const [loggingIn, setLoggingIn] = useState(false);

  useEffect(() => {
    if (!supabaseClient) { setSession(null); return; }

    // Se o link veio do botão "Studio de protocolo" do app principal, a
    // sessão chega aqui via hash (#at=...&rt=...) em vez de depender de
    // localStorage compartilhado (ver abrirStudioComSessao em protocolos.js).
    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    const at = hash.get("at");
    const rt = hash.get("rt");
    if (at && rt) {
      history.replaceState(null, "", location.pathname + location.search); // tira o token da URL/histórico
      supabaseClient.auth.setSession({ access_token: at, refresh_token: rt })
        .then(({ data }) => setSession(data?.session || null));
    } else {
      supabaseClient.auth.getSession().then(({ data }) => setSession(data?.session || null));
    }

    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub?.subscription?.unsubscribe();
  }, []);

  if (!supabaseClient) {
    return (
      <div style={{ padding: 40, fontFamily: "sans-serif", color: "#7c2d12", background: "#fff7ed", maxWidth: 560, margin: "60px auto", borderRadius: 12, border: "1px solid #fed7aa" }}>
        <b>Studio sem configuração.</b> Preencha <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code>
        {" "}no bloco <code>&lt;script&gt;</code> no topo deste arquivo (são os mesmos valores públicos usados no app principal).
      </div>
    );
  }

  if (session === undefined) {
    return <div style={{ padding: 40, fontFamily: "sans-serif", color: "#64748b" }}>Carregando…</div>;
  }

  if (!session) {
    async function handleLogin(e) {
      e.preventDefault();
      setLoggingIn(true); setLoginError(null);
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) setLoginError(error.message);
      setLoggingIn(false);
    }
    return (
      <form onSubmit={handleLogin} style={{ maxWidth: 340, margin: "100px auto", fontFamily: "sans-serif", display: "flex", flexDirection: "column", gap: 10 }}>
        <h2 style={{ fontSize: 18, marginBottom: 4 }}>Entrar no Studio</h2>
        <input type="email" placeholder="E-mail" value={email} onChange={(e) => setEmail(e.target.value)}
          style={{ padding: 10, borderRadius: 8, border: "1px solid #cbd5e1" }} required />
        <input type="password" placeholder="Senha" value={password} onChange={(e) => setPassword(e.target.value)}
          style={{ padding: 10, borderRadius: 8, border: "1px solid #cbd5e1" }} required />
        {loginError && <div style={{ color: "#dc2626", fontSize: 12.5 }}>{loginError}</div>}
        <button type="submit" disabled={loggingIn}
          style={{ padding: 10, borderRadius: 8, border: "none", background: "#7c3aed", color: "#fff", fontWeight: 700, cursor: "pointer" }}>
          {loggingIn ? "Entrando…" : "Entrar"}
        </button>
      </form>
    );
  }

  return <ProtocolCanvas />;
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>
<script>
  // Transformação manual (em vez de deixar o Babel Standalone escanear
  // automaticamente scripts type="text/babel"): a versão mais recente do
  // Babel usa por padrão o "automatic JSX runtime", que gera um
  // `import {...} from "react/jsx-runtime"` no código transpilado -- e como
  // aqui o React é carregado como script UMD clássico (variável global, sem
  // sistema de módulos), esse import quebra tudo ("Cannot use import
  // statement outside a module"). Forçando runtime: "classic" o Babel gera
  // React.createElement(...) em vez disso, usando o React global — sem
  // nenhum import.
  var appSource = document.getElementById("app-source").textContent;
  var transformed = Babel.transform(appSource, { presets: [["react", { runtime: "classic" }]] }).code;
  var appScript = document.createElement("script");
  appScript.text = transformed;
  document.body.appendChild(appScript);
</script>
</body>
</html>
