<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Assistente MediCopilot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Autenticação (exigida a cada 30 dias) -->
    <section id="auth" class="screen">
      <div class="brand"><span class="logo">MC</span><b>Assistente MediCopilot</b></div>
      <p class="muted">Entre com a sua conta do MediCopilot para usar o assistente.</p>
      <label class="lbl">E-mail</label>
      <input id="au-email" class="inp" type="email" autocomplete="username" placeholder="voce@clinica.com" />
      <label class="lbl">Senha</label>
      <input id="au-pass" class="inp" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button id="au-btn" class="btn">Entrar</button>
      <div id="au-msg" class="err"></div>
      <p class="muted tiny">Por segurança, a autenticação é solicitada novamente a cada 30 dias.</p>
    </section>

    <!-- Chat -->
    <section id="chat" class="screen hidden">
      <header class="head">
        <div class="brand"><span class="logo">MC</span><b>Assistente</b></div>
        <div class="head-actions">
          <button id="ch-hist" class="ghost" title="Histórico de conversas (7 dias)" aria-label="Histórico">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3.5 2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <button id="ch-new" class="ghost" title="Nova conversa">＋</button>
          <button id="ch-out" class="ghost" title="Sair">⏻</button>
        </div>
      </header>
      <!-- Painel de histórico (sobrepõe o chat) -->
      <aside id="hist" class="hist hidden">
        <div class="hist-head">
          <b>Histórico (últimos 7 dias)</b>
          <button id="hist-close" class="ghost" title="Fechar">✕</button>
        </div>
        <div id="hist-empty" class="hist-empty hidden">Nenhuma conversa recente.</div>
        <ul id="hist-list" class="hist-list"></ul>
        <div class="hist-foot">
          <button id="hist-clear" class="link-btn">Limpar todo o histórico</button>
        </div>
      </aside>
      <div id="ctx" class="ctx">Contexto da tela: <span id="ctx-info">lendo…</span></div>
      <div id="msgs" class="msgs"></div>
      <div class="chips" id="ch-chips">
        <button class="chip" type="button" data-prompt="Agendar um paciente">📅 Agendar paciente</button>
        <button class="chip" type="button" data-prompt="Gerar uma receita">💊 Gerar receita</button>
        <button class="chip" type="button" data-prompt="Gerar um atestado">📄 Atestado/declaração</button>
        <button class="chip" type="button" data-prompt="Gerar uma anamnese">📋 Gerar anamnese</button>
        <button class="chip" type="button" data-prompt="Quantos pacientes eu já atendi hoje?">📊 Pacientes hoje</button>
        <button class="chip" type="button" data-prompt="Qual o horário do meu próximo paciente?">🕒 Próximo paciente</button>
      </div>
      <form id="ch-form" class="composer">
        <textarea id="ch-inp" rows="1" placeholder="Pergunte algo sobre a tela ou o paciente…"></textarea>
        <button class="send" type="submit" title="Enviar">➤</button>
        <button id="ch-mic" class="mic" type="button" title="Gravar (Deepgram) — inicia um novo Atendimento">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </button>
      </form>
      <div id="ch-mic-status" class="mic-status hidden"></div>
    </section>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="history.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
