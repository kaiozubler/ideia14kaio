// --- Auth (Supabase) ---------------------------------------------------
// Página estática, sem sessão vinda do app principal por build/import — só
// reaproveita o localStorage se estiver no mesmo domínio (ver comentário no
// <head>). Client único, reusado por toda a página. window.supabase já
// existe neste ponto (script clássico, carregado em ordem, antes deste
// bloco text/babel).
const supabaseClient = (window.__STUDIO_SUPABASE_URL__ && window.__STUDIO_SUPABASE_ANON_KEY__)
  ? window.supabase.createClient(window.__STUDIO_SUPABASE_URL__, window.__STUDIO_SUPABASE_ANON_KEY__)
  : null;

async function getAccessToken() {
  if (!supabaseClient) throw new Error("Studio sem configuração do Supabase (preencha SUPABASE_URL/ANON_KEY no topo do arquivo).");
  const { data } = await supabaseClient.auth.getSession();
  const token = data?.session?.access_token;
  if (!token) throw new Error("Sessão expirada ou não autenticado. Faça login novamente.");
  return token;
}

// Fetch autenticado pras rotas /api/... do backend (não confundir com a
// chamada direta ao Supabase acima — essas rotas usam Authorization: Bearer).
async function studioFetch(path, options = {}) {
  const token = await getAccessToken();
  const resp = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(options.headers || {}) },
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data?.error || `Erro ${resp.status}`);
  return data;
}

async function buscarTussApi(termo) {
  if (!termo || termo.trim().length < 2) return [];
  const data = await studioFetch("/api/tuss/buscar?q=" + encodeURIComponent(termo), { method: "GET" });
  return (data.items || []).map((it) => ({ id: it.id, codigo: it.codigo_tuss, nome: it.nome }));
}
async function buscarSubstanciaApi(termo) {
  if (!termo || termo.trim().length < 2) return [];
  const data = await studioFetch("/api/medicamentos/buscar?q=" + encodeURIComponent(termo), { method: "GET" });
  return (data.items || []).map((it) => ({ id: it.id_substancia, nome: it.nome_exibicao }));
}
// Debounce simples e genérico pra ligar num useEffect de busca.
function useDebouncedSearch(termo, searchFn, delayMs) {
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  useEffect(() => {
    if (!termo || termo.trim().length < 2) { setResults([]); return; }
    let cancelled = false;
    setLoading(true);
    const t = setTimeout(() => {
      searchFn(termo).then((r) => { if (!cancelled) setResults(r); })
        .catch(() => { if (!cancelled) setResults([]); })
        .finally(() => { if (!cancelled) setLoading(false); });
    }, delayMs || 300);
    return () => { cancelled = true; clearTimeout(t); };
  }, [termo]);
  return { results, loading };
}

// mesmo contrato de dados dos nós/arestas manuais. O modelo devolve ids
// "locais" (n1, n2, b1...) que a gente remapeia pra uid()s reais aqui,
// então a ordem/nomeação que a IA escolher não importa.
// ---------------------------------------------------------------------------
const AI_SCHEMA_PROMPT = `Você converte um protocolo clínico em texto para um grafo JSON usado por um editor visual de protocolos.

Responda APENAS com um objeto JSON válido, sem markdown, sem \`\`\`, sem texto antes ou depois.

Formato exato esperado:
{
  "name": "Nome curto do protocolo",
  "nodes": [
    { "localId": "n1", "type": "Admissao", "name": "...", "clauses": [ {"sourceKind":"paciente","variavel":"cid","operador":"contem","valor":"E10","conector":null} ] },
    { "localId": "n2", "type": "Exame", "name": "...", },
    { "localId": "n3", "type": "Medicamento", "name": "...", "dose": "...", "posologia": "..." },
    { "localId": "n4", "type": "Consulta", "name": "...", "especialidade": "..." },
    { "localId": "n5", "type": "Condicao", "name": "...", "branches": [
        { "localId": "b1", "isDefault": false, "descricao": "...", "clauses": [
            {"sourceKind":"exame","sourceLocalId":"n2","campo":"numero","operador":"maior_ou_igual","numero":"126","conector":null},
            {"sourceKind":"medicamento","sourceLocalId":"n3","estado":"em_uso","conector":"E"},
            {"sourceKind":"paciente","variavel":"idade","operador":"maior_que","valor":"18","conector":"OU"}
        ] },
        { "localId": "b2", "isDefault": true }
    ] },
    { "localId": "n6", "type": "Evento", "name": "...", "acao": "notificar_usuario", "alvoLocalId": "n3", "motivo": "...", "conteudo": "...", "destinatario": "..." }
  ],
  "edges": [
    { "fromLocalId": "n1", "fromHandle": "admitido", "toLocalId": "n2", "lapso": 0 },
    { "fromLocalId": "n5", "fromHandle": "b1", "toLocalId": "n6", "lapso": 0 }
  ]
}

Regras do schema:
- "type" só pode ser: Admissao, Exame, Medicamento, Consulta, Condicao, Evento.
- Admissao: só clauses (nunca branches), sourceKind quase sempre "paciente". Saídas fixas ao conectar: "admitido" / "nao_admitido".
- Condicao: só branches (nunca clauses direto); cada branch tem seu próprio "clauses" (cadeia E/OU) OU "isDefault": true (fallback, sem clauses). Handle da aresta = o "localId" do branch.
- clause.sourceKind: "exame" | "medicamento" | "paciente". "exame" e "medicamento" exigem "sourceLocalId" apontando pra um nó Exame/Medicamento já listado. "paciente" usa "variavel" (sexo/idade/peso/altura/gestante/cid) em vez de sourceLocalId.
- clause de exame: "campo" é "numero"|"texto"|"achado". Se numero: "operador" é maior_que/menor_que/maior_ou_igual/menor_ou_igual/entre/igual, com "numero" (ou numero_min/numero_max se entre). Se achado: "conceito" (texto) + "presente" (bool).
- clause de medicamento: só "estado": "em_uso" | "suspenso".
- clause de paciente: "operador" (maior_que/menor_que/maior_ou_igual/menor_ou_igual/entre/igual/contem) + "valor" (string).
- A 1ª clause de uma cadeia tem "conector": null; as seguintes têm "E" ou "OU".
- Evento.acao: suspender | ajustar | mensagem_paciente | notificar_usuario | gerar_receita | enviar_receita | solicitar_exame. "alvoLocalId" referencia outro nó do fluxo (opcional).
- edges: "fromHandle" é null pra Exame/Medicamento/Consulta/Evento (saída única), "admitido"/"nao_admitido" pra Admissao, e o localId do branch pra Condicao.
- IMPORTANTE — cubra o protocolo completo: modele todos os ramos e exceções relevantes descritos no texto/PDF (não só o caminho principal), até um limite de 40 nós no total. Se o protocolo for maior que isso, priorize completude clínica (todas as condições/exames/medicamentos citados) sobre detalhamento de cada um — nomes e textos curtos e diretos.`;

async function generateFlowFromAI(protocolText, pdf) {
  // Via proxy de backend (/api/ia/gerar-fluxo) — chave fica só no servidor,
  // nunca no navegador. Ver src/routes/api/ia/gerar-fluxo.ts. Usa o AI
  // Gateway do Lovable (mesmo do resto do app), resposta no formato
  // OpenAI-compatible: choices[0].message.content.
  // pdf (opcional): { base64, filename } — a IA lê o PDF anexado direto,
  // igual o fluxo oficial de gerar protocolo já faz.
  const prompt = `${AI_SCHEMA_PROMPT}\n\nPROTOCOLO:\n"""\n${protocolText || "(ver documento PDF anexo)"}\n"""`;
  const data = await studioFetch("/api/ia/gerar-fluxo", {
    method: "POST",
    body: JSON.stringify({ prompt, pdfBase64: pdf?.base64 || null, filename: pdf?.filename || null }),
  });
  const text = data?.choices?.[0]?.message?.content || "";
  const cleaned = text.replace(/```json|```/g, "").trim();
  let spec;
  try { spec = JSON.parse(cleaned); }
  catch { throw new Error("A IA não devolveu um JSON válido. Tente um texto mais curto/direto."); }
  return spec;
}

// Lê um File (PDF) como base64 puro (sem o prefixo data:...;base64,).
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(reader.error || new Error("Falha ao ler o arquivo"));
    reader.readAsDataURL(file);
  });
}

function buildGraphFromAiSpec(spec) {
  const idMap = {}; const handleMap = {};
  const ensureId = (localId) => { if (!localId) return null; if (!idMap[localId]) idMap[localId] = uid(); return idMap[localId]; };
  function mapClause(c) {
    const base = { id: uid(), sourceKind: c.sourceKind, conector: c.conector ?? null };
    if (c.sourceKind === "medicamento") { base.sourceNodeId = ensureId(c.sourceLocalId); base.estado = c.estado || "em_uso"; }
    else if (c.sourceKind === "paciente") { base.sourceNodeId = null; base.variavel = c.variavel || "idade"; base.operador = c.operador || "igual"; base.valor = c.valor ?? ""; }
    else { base.sourceKind = "exame"; base.sourceNodeId = ensureId(c.sourceLocalId); base.campo = c.campo || "numero"; base.operador = c.operador || "maior_que";
      base.numero = c.numero; base.numero_min = c.numero_min; base.numero_max = c.numero_max; base.texto = c.texto; base.conceito = c.conceito; base.presente = c.presente; }
    return base;
  }
  const nodes = (spec.nodes || []).map((n) => {
    const id = ensureId(n.localId);
    const base = { id, type: n.type, name: n.name || n.type, x: 0, y: 0, lapso: 0 };
    if (n.type === "Condicao") {
      const branches = (n.branches || []).map((b) => {
        const bId = uid();
        if (b.localId) handleMap[b.localId] = bId;
        return { id: bId, isDefault: !!b.isDefault, descricao: b.descricao || "", clauses: (b.clauses || []).map(mapClause) };
      });
      return { ...base, branches: branches.length ? branches : [{ id: uid(), isDefault: true, descricao: "Caso padrão" }] };
    }
    if (n.type === "Admissao") return { ...base, clauses: (n.clauses || []).map(mapClause) };
    if (n.type === "Evento") return { ...base, acao: n.acao || "notificar_usuario", alvoId: ensureId(n.alvoLocalId), motivo: n.motivo || "", conteudo: n.conteudo || "", destinatario: n.destinatario || "", fator: n.fator || "" };
    if (n.type === "Medicamento") return { ...base, substanciaId: null, dose: n.dose || "", posologia: n.posologia || "" };
    if (n.type === "Consulta") return { ...base, especialidade: n.especialidade || "" };
    return { ...base, tussId: null }; // Exame
  });
  const edges = (spec.edges || []).map((e) => {
    let fromHandle = e.fromHandle ?? null;
    if (fromHandle && fromHandle !== "admitido" && fromHandle !== "nao_admitido" && handleMap[fromHandle]) fromHandle = handleMap[fromHandle];
    return { id: uid(), from: ensureId(e.fromLocalId), to: ensureId(e.toLocalId), fromHandle, lapso: Number(e.lapso) || 0 };
  }).filter((e) => e.from && e.to);
  return { nodes, edges };
}

// Lapso "de verdade" pra exibir no rosto do card: se o nó tem entrada(s), o
// lapso vem da(s) aresta(s) que chegam nele (única fonte usada no layout
// temporal); só um nó-raiz (sem entrada) usa o próprio campo `lapso`.
function displayLapso(node, edges) {
  const incoming = edges.filter((e) => e.to === node.id);
  if (!incoming.length) return Number(node.lapso) || 0;
  const vals = new Set(incoming.map((e) => Number(e.lapso) || 0));
  if (vals.size === 1) return [...vals][0];
  return null; // varia por conexão — não dá pra resumir num número só
}

// Profundidade "topológica" — maior distância entre qualquer raiz e o nó,
// considerando TODOS os pais quando há reuso (fan-in). Sem isso, um nó
// alimentado por pais em profundidades diferentes podia acabar acima de um deles.
function computeDepths(nodes, edges) {
  const childrenOf = {};
  const indeg = {};
  nodes.forEach((n) => (indeg[n.id] = 0));
  edges.forEach((e) => { (childrenOf[e.from] = childrenOf[e.from] || []).push(e.to); if (indeg[e.to] !== undefined) indeg[e.to] += 1; });
  const depth = {};
  const queue = nodes.filter((n) => indeg[n.id] === 0).map((n) => n.id);
  queue.forEach((id) => (depth[id] = 0));
  const work = { ...indeg };
  for (let i = 0; i < queue.length; i++) {
    const id = queue[i];
    (childrenOf[id] || []).forEach((cid) => {
      depth[cid] = Math.max(depth[cid] ?? 0, (depth[id] ?? 0) + 1);
      work[cid] -= 1;
      if (work[cid] === 0) queue.push(cid);
    });
  }
  nodes.forEach((n) => { if (depth[n.id] === undefined) depth[n.id] = 0; }); // fallback (ciclo/nó isolado)
  return depth;
}

function autoLayout(nodes, edges, mode) {
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const children = {}; const hasParent = new Set();
  edges.forEach((e) => { (children[e.from] = children[e.from] || []).push(e); hasParent.add(e.to); });
  const roots = nodes.filter((n) => !hasParent.has(n.id));
  const COL_W = 250, PX_PER_DAY = 26;

  const depthOf = computeDepths(nodes, edges);
  const maxDepth = Math.max(0, ...nodes.map((n) => depthOf[n.id] || 0));
  const rowH = [];
  for (let d = 0; d <= maxDepth; d++) {
    const atDepth = nodes.filter((n) => (depthOf[n.id] || 0) === d);
    rowH[d] = Math.max(110, ...atDepth.map((n) => cardBottomOffset(n))) + 80;
  }
  const rowY = [50];
  for (let d = 1; d <= maxDepth; d++) rowY[d] = rowY[d - 1] + rowH[d - 1];

  let leaf = 0; const next = {};
  function place(node, cumDays) {
    if (next[node.id]) return next[node.id].x; // já posicionado por outro pai (reuso/fan-in) — não reprocessa
    const kids = children[node.id] || [];
    const y = mode === "temporal" ? 50 + cumDays * PX_PER_DAY : rowY[depthOf[node.id] || 0];
    if (!kids.length) { next[node.id] = { x: leaf * COL_W, y }; leaf += 1; return next[node.id].x; }
    const xs = kids.map((e) => { const c = byId[e.to]; return c ? place(c, cumDays + (Number(e.lapso) || 0)) : 0; });
    const x = xs.reduce((a, b) => a + b, 0) / xs.length; // média — um filho isolado não puxa mais o pai inteiro
    next[node.id] = { x, y }; return x;
  }
  roots.forEach((r) => place(r, Number(r.lapso) || 0));

  // Pós-processo: a média usada pra centralizar o pai reduz bastante os
  // exageros de antes, mas ainda pode deixar dois irmãos da MESMA linha com
  // x parecido (principalmente com nós reaproveitados por vários pais). Aqui
  // garantimos uma distância mínima de verdade, não só uma tendência.
  const MIN_GAP = NODE_W + 60;
  const rowKeyOf = (id) => (mode === "temporal" ? Math.round(next[id].y / 8) : (depthOf[id] || 0));
  const byRow = {};
  nodes.forEach((n) => { if (!next[n.id]) return; const k = rowKeyOf(n.id); (byRow[k] = byRow[k] || []).push(n.id); });
  Object.values(byRow).forEach((ids) => {
    const sorted = ids.sort((a, b) => next[a].x - next[b].x);
    for (let i = 1; i < sorted.length; i++) {
      const prevX = next[sorted[i - 1]].x;
      if (next[sorted[i]].x - prevX < MIN_GAP) next[sorted[i]].x = prevX + MIN_GAP;
    }
  });

  return nodes.map((n) => ({ ...n, x: next[n.id]?.x ?? n.x, y: next[n.id]?.y ?? n.y }));
}

function handlesForNode(node) {
  if (node.type === "Condicao") return node.branches.map((b) => ({ id: b.id, label: b.isDefault ? "Caso padrão" : (b.descricao || "Ramo") }));
  if (node.type === "Admissao") return [{ id: "admitido", label: "Admitido" }, { id: "nao_admitido", label: "Não admitido" }];
  return [{ id: null, label: "Próximo" }];
}
function clauseSummary(c, nodesById) {
  if (c.sourceKind === "medicamento") {
    const n = nodesById[c.sourceNodeId];
    return `${n?.name || "Medicamento"} está ${c.estado === "em_uso" ? "em uso" : "suspenso"}`;
  }
  if (c.sourceKind === "paciente") {
    const v = PATIENT_VARS.find((p) => p.id === c.variavel);
    const opLabel = (v?.kind === "numero" ? OPERADORES_NUMERO : v?.kind === "texto" ? OPERADORES_TEXTO : OPERADORES_ENUM).find((o) => o.id === c.operador)?.label || c.operador;
    return `${v?.label || c.variavel} ${opLabel} ${c.valor ?? "?"}`;
  }
  // exame
  const n = nodesById[c.sourceNodeId];
  const prefix = n?.name ? `${n.name}: ` : "Exame: ";
  if (c.campo === "achado") return `${prefix}achado "${c.conceito || "?"}" ${c.presente === false ? "ausente" : "presente"}`;
  if (c.operador === "entre") return `${prefix}entre ${c.numero_min ?? "?"} e ${c.numero_max ?? "?"}`;
  const opLabel = (c.campo === "numero" ? OPERADORES_NUMERO : OPERADORES_TEXTO).find((o) => o.id === c.operador)?.label || c.operador;
  return `${prefix}${opLabel} ${c.campo === "numero" ? (c.numero ?? "?") : `"${c.texto ?? "?"}"`}`;
}
function branchSummary(b, nodesById) {
  if (b.isDefault) return "Nenhuma regra anterior bateu";
  if (!b.clauses || !b.clauses.length) return "(sem cláusulas)";
  return b.clauses.map((c, i) => (i === 0 ? "" : `${c.conector === "OU" ? "OU " : "E "}`) + clauseSummary(c, nodesById)).join(" ");
}
function clauseChainSummary(clauses, nodesById) {
  if (!clauses || !clauses.length) return "(sem critérios definidos)";
  return clauses.map((c, i) => (i === 0 ? "" : `${c.conector === "OU" ? "OU " : "E "}`) + clauseSummary(c, nodesById)).join(" ");
}

// Altura aproximada do card até a borda inferior — os cantos (setas) se apoiam aqui.
function cardBottomOffset(node) {
  const header = 46, bodyPad = 16;
  if (node.type === "Condicao") {
    const lines = node.branches.reduce((acc, b) => acc + Math.max(1, (b.clauses?.length || 0)), 0);
    return header + bodyPad + lines * 15;
  }
  if (node.type === "Admissao") return header + bodyPad + Math.max(1, (node.clauses?.length || 0)) * 15;
  return header + bodyPad + 14;
}
// Pontos de saída de um nó, em coordenadas do canvas — 1 seta (canto direito) para
// nós de saída única; distribuídas dos dois cantos pra dentro quando há vários ramos.
function outputAnchors(node) {
  const bottom = cardBottomOffset(node);
  const handles = handlesForNode(node);
  if (handles.length === 1) return [{ ...handles[0], x: node.x + NODE_W / 2, y: node.y + bottom }];
  return handles.map((h, i) => ({ ...h, x: node.x + 24 + (NODE_W - 48) * (i / (handles.length - 1)), y: node.y + bottom }));
}
function findSnapTarget(localX, localY, nodes, excludeNodeId) {
  let best = null, bestDist = SNAP_RADIUS;
  nodes.forEach((n) => {
    if (n.id === excludeNodeId) return;
    outputAnchors(n).forEach((a) => {
      const d = Math.hypot(a.x - localX, a.y - localY);
      if (d < bestDist) { bestDist = d; best = { nodeId: n.id, handleId: a.id, x: a.x, y: a.y }; }
    });
  });
  return best;
}
// Ponto de CHEGADA de uma aresta específica no card de destino. Antes era sempre
// o centro-topo fixo — se várias arestas iam pro mesmo nó, todas convergiam pro
// mesmo pixel ("cortando no mesmo lugar"). Agora distribui pela borda de cima,
// igual já fazemos com as saídas na borda de baixo.
function inputAnchor(toNode, edgeId, allEdges) {
  const incoming = allEdges.filter((e) => e.to === toNode.id);
  const idx = Math.max(0, incoming.findIndex((e) => e.id === edgeId));
  const n = incoming.length;
  if (n <= 1) return { x: toNode.x + NODE_W / 2, y: toNode.y };
  return { x: toNode.x + 24 + (NODE_W - 48) * (idx / (n - 1)), y: toNode.y };
}

function ProtocolCanvas() {
  const [protocolKey, setProtocolKey] = useState("novo");
  const [graph, setGraph] = useState(() => PROTOCOLS.novo.seed());
  const [aiOpen, setAiOpen] = useState(false);
  const [aiText, setAiText] = useState("");
  const [aiPdfFile, setAiPdfFile] = useState(null); // { name, base64 } | null
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState(null);
  const [customLabel, setCustomLabel] = useState(null);

  const [draftId, setDraftId] = useState(null);
  const [draftTitle, setDraftTitle] = useState("Rascunho sem título");
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState(null);
  const [rascunhosOpen, setRascunhosOpen] = useState(false);
  const [rascunhos, setRascunhos] = useState([]);
  const [rascunhosLoading, setRascunhosLoading] = useState(false);

  async function handleSalvarRascunho() {
    setSaving(true); setSaveError(null);
    try {
      const result = await salvarRascunho({ id: draftId, titulo: draftTitle, grafo: graph });
      setDraftId(result.id);
    } catch (err) {
      setSaveError(err.message || String(err));
    } finally {
      setSaving(false);
    }
  }

  async function handleAbrirRascunhos() {
    setRascunhosOpen(true);
    setRascunhosLoading(true);
    try {
      setRascunhos(await listarRascunhos());
    } catch (err) {
      setSaveError(err.message || String(err));
    } finally {
      setRascunhosLoading(false);
    }
  }

  async function handleCarregarRascunho(id) {
    setRascunhosLoading(true);
    try {
      const r = await carregarRascunho(id);
      setGraph(r.grafo && r.grafo.nodes ? r.grafo : { nodes: [], edges: [] });
      setDraftId(r.id);
      setDraftTitle(r.titulo);
      setCustomLabel(null);
      setSelectedId(null);
      setPan({ x: 220, y: 40 });
      setRascunhosOpen(false);
    } catch (err) {
      setSaveError(err.message || String(err));
    } finally {
      setRascunhosLoading(false);
    }
  }

  async function handleAiGenerate() {
    if ((!aiText.trim() && !aiPdfFile) || aiLoading) return;
    setAiLoading(true); setAiError(null);
    try {
      const spec = await generateFlowFromAI(aiText, aiPdfFile ? { base64: aiPdfFile.base64, filename: aiPdfFile.name } : null);
      const built = buildGraphFromAiSpec(spec);
      if (!built.nodes.length) throw new Error("A IA não gerou nenhum nó — tenta reformular o texto.");
      const laidOutNodes = autoLayout(built.nodes, built.edges, "proximidade");
      setGraph({ nodes: laidOutNodes, edges: built.edges });
      setCustomLabel(spec.name || "Fluxo gerado por IA");
      setSelectedId(null);
      setPan({ x: 220, y: 40 });
      setAiOpen(false);
      setAiText("");
      setAiPdfFile(null);
    } catch (err) {
      setAiError(err.message || String(err));
    } finally {
      setAiLoading(false);
    }
  }

  async function handleAiPdfSelect(file) {
    if (!file) return;
    if (file.type !== "application/pdf") { setAiError("Só é aceito arquivo PDF."); return; }
    if (file.size > 10 * 1024 * 1024) { setAiError("PDF muito grande (máx. 10MB)."); return; }
    setAiError(null);
    try {
      const base64 = await fileToBase64(file);
      setAiPdfFile({ name: file.name, base64 });
    } catch {
      setAiError("Não consegui ler o PDF. Tenta de novo.");
    }
  }
  const [layoutMode, setLayoutMode] = useState("proximidade");
  const [selectedId, setSelectedId] = useState(null);
  const [connecting, setConnecting] = useState(null);
  const [cursorPos, setCursorPos] = useState(null);
  const [hoveredId, setHoveredId] = useState(null);
  const [hoveredArrow, setHoveredArrow] = useState(null); // "nodeId:handleId"
  const [snapTarget, setSnapTarget] = useState(null);
  const [isDraggingNode, setIsDraggingNode] = useState(false);
  const [overTrash, setOverTrash] = useState(false);
  const [pan, setPan] = useState({ x: 220, y: 40 });
  const canvasRef = useRef(null);
  const trashRef = useRef(null);

  const dragRef = useRef(null);
  const panningRef = useRef(null);
  const connectingRef = useRef(null);
  const snapTargetRef = useRef(null);
  const overTrashRef = useRef(false);
  const panRef = useRef(pan);
  const graphRef = useRef(graph);
  useEffect(() => { panRef.current = pan; }, [pan]);
  useEffect(() => { connectingRef.current = connecting; }, [connecting]);
  useEffect(() => { graphRef.current = graph; }, [graph]);

  const nodesById = useMemo(() => Object.fromEntries(graph.nodes.map((n) => [n.id, n])), [graph.nodes]);
  const selected = selectedId ? nodesById[selectedId] : null;

  const fontesDoNo = useCallback((nodeId) => {
    return graph.edges
      .filter((e) => e.to === nodeId)
      .map((e) => nodesById[e.from])
      .filter((n) => n && (n.type === "Exame" || n.type === "Medicamento"));
  }, [graph.edges, nodesById]);

  const updateNode = useCallback((id, patch) => setGraph((g) => ({ ...g, nodes: g.nodes.map((n) => (n.id === id ? { ...n, ...patch } : n)) })), []);
  const updateEdge = useCallback((id, patch) => setGraph((g) => ({ ...g, edges: g.edges.map((e) => (e.id === id ? { ...e, ...patch } : e)) })), []);
  const removeNode = useCallback((id) => { setGraph((g) => ({ nodes: g.nodes.filter((n) => n.id !== id), edges: g.edges.filter((e) => e.from !== id && e.to !== id) })); setSelectedId(null); }, []);
  const removeEdge = useCallback((id) => setGraph((g) => ({ ...g, edges: g.edges.filter((e) => e.id !== id) })), []);
  const addEdgeIfMissing = useCallback((from, fromHandle, to) => {
    setGraph((g) => {
      const exists = g.edges.some((ed) => ed.from === from && ed.to === to && ed.fromHandle === fromHandle);
      return exists ? g : { ...g, edges: [...g.edges, { id: uid(), from, to, fromHandle, lapso: 0 }] };
    });
  }, []);

  function applyLayout(mode) { setLayoutMode(mode); setGraph((g) => ({ ...g, nodes: autoLayout(g.nodes, g.edges, mode) })); }

  function makeNode(type, x, y) {
    const base = { id: uid(), type, x, y, lapso: 0 };
    if (type === "Condicao") return { ...base, name: "Nova condição", branches: [
      { id: uid(), descricao: "", clauses: [] },
      { id: uid(), isDefault: true, descricao: "Caso padrão" },
    ] };
    if (type === "Evento") return { ...base, name: "Novo evento", acao: "suspender", alvoId: null, motivo: "" };
    if (type === "Admissao") return { ...base, name: "Critério de admissão", clauses: [] };
    if (type === "Medicamento") return { ...base, name: "Novo medicamento", substanciaId: null, dose: "", posologia: "" };
    if (type === "Exame") return { ...base, name: "Novo exame", tussId: null };
    return { ...base, name: "Nova consulta", especialidade: "" };
  }

  function addFromRail(type) {
    const count = graph.nodes.length;
    const node = makeNode(type, 40 + (count % 5) * 40, 40 + Math.floor(count / 5) * 60);
    setGraph((g) => ({ ...g, nodes: [...g.nodes, node] }));
    setSelectedId(node.id);
  }

  function localFromClient(clientX, clientY) {
    const rect = canvasRef.current.getBoundingClientRect();
    return { x: clientX - rect.left - panRef.current.x, y: clientY - rect.top - panRef.current.y };
  }

  function handleCanvasDragOver(e) {
    e.preventDefault();
    const local = localFromClient(e.clientX, e.clientY);
    const snap = findSnapTarget(local.x, local.y, graphRef.current.nodes, null);
    snapTargetRef.current = snap;
    setSnapTarget(snap);
  }

  function handleCanvasDrop(e) {
    e.preventDefault();
    const raw = e.dataTransfer.getData("application/x-protocol-node");
    const snap = snapTargetRef.current;
    snapTargetRef.current = null; setSnapTarget(null);
    if (!raw) return;
    const item = JSON.parse(raw);
    const local = localFromClient(e.clientX, e.clientY);
    let node;
    if (snap) {
      node = makeNode(item.type, snap.x - NODE_W / 2, snap.y + STANDARD_GAP);
    } else {
      node = makeNode(item.type, local.x - 90, local.y - 30);
    }
    setGraph((g) => ({ ...g, nodes: [...g.nodes, node] }));
    setSelectedId(node.id);
    if (snap) addEdgeIfMissing(snap.nodeId, snap.handleId, node.id);
  }

  function onNodeMouseDown(e, node) {
    if (e.target.closest("[data-nocard-drag]") || e.target.closest("[data-arrow]")) return;
    e.preventDefault();
    const local = localFromClient(e.clientX, e.clientY);
    dragRef.current = { id: node.id, offX: local.x - node.x, offY: local.y - node.y };
    setSelectedId(node.id);
    setIsDraggingNode(true);
  }
  function onCanvasMouseDown(e) {
    if (e.target !== canvasRef.current && !e.target.dataset.canvasBg) return;
    setSelectedId(null);
    panningRef.current = { startX: e.clientX - pan.x, startY: e.clientY - pan.y };
  }
  function startConnection(e, node, handleId) {
    e.preventDefault(); e.stopPropagation();
    const c = { from: node.id, fromHandle: handleId };
    connectingRef.current = c;
    setConnecting(c);
  }

  useEffect(() => {
    function onMove(e) {
      if (dragRef.current) {
        const local = localFromClient(e.clientX, e.clientY);
        const nx = local.x - dragRef.current.offX, ny = local.y - dragRef.current.offY;
        updateNode(dragRef.current.id, { x: nx, y: ny });

        // lixeira: mede a distância do cursor (em coordenadas de tela) até o ícone
        let over = false;
        if (trashRef.current) {
          const r = trashRef.current.getBoundingClientRect();
          const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
          over = d < 42;
        }
        overTrashRef.current = over;
        setOverTrash(over);

        // ímã: usa a posição real do cursor pra ver se está sobre a seta de outro nó
        // (some com a prioridade do ímã sempre que estiver sobre a lixeira)
        const snap = over ? null : findSnapTarget(local.x, local.y, graphRef.current.nodes, dragRef.current.id);
        snapTargetRef.current = snap;
        setSnapTarget(snap);
      } else if (panningRef.current) {
        setPan({ x: e.clientX - panningRef.current.startX, y: e.clientY - panningRef.current.startY });
      } else if (connectingRef.current) {
        setCursorPos(localFromClient(e.clientX, e.clientY));
      }
    }
    function onUp(e) {
      if (dragRef.current) {
        if (overTrashRef.current) {
          removeNode(dragRef.current.id);
        } else if (snapTargetRef.current) {
          const snap = snapTargetRef.current;
          const draggedId = dragRef.current.id;
          if (snap.nodeId !== draggedId) {
            updateNode(draggedId, { x: snap.x - NODE_W / 2, y: snap.y + STANDARD_GAP });
            addEdgeIfMissing(snap.nodeId, snap.handleId, draggedId);
          }
        }
      }
      if (connectingRef.current) {
        const nodeEl = e.target.closest && e.target.closest("[data-node-id]");
        const c = connectingRef.current;
        if (nodeEl) {
          const targetId = nodeEl.getAttribute("data-node-id");
          if (targetId !== c.from) {
            addEdgeIfMissing(c.from, c.fromHandle, targetId);
            connectingRef.current = null; setConnecting(null); setCursorPos(null);
          }
          // soltou de volta no próprio nó de origem -> mantém armado
        } else {
          connectingRef.current = null; setConnecting(null); setCursorPos(null);
        }
      }
      dragRef.current = null;
      panningRef.current = null;
      snapTargetRef.current = null;
      overTrashRef.current = false;
      setSnapTarget(null);
      setIsDraggingNode(false);
      setOverTrash(false);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp, true);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp, true);
    };
  }, [updateNode, addEdgeIfMissing, removeNode]);

  function edgePath(x1, y1, x2, y2) { const midY = (y1 + y2) / 2; return `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`; }

  return (
    <div style={{ width: "100%", height: 720, borderRadius: 28, position: "relative", overflow: "hidden",
      fontFamily: "-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif",
      background: "linear-gradient(135deg, #eef8f1 0%, #f3f1fb 45%, #fdf6ec 100%)" }}>
      <div style={{ position: "absolute", width: 420, height: 420, top: -140, right: -120, borderRadius: "50%", background: "#ddd6fe", opacity: 0.5, filter: "blur(70px)", pointerEvents: "none" }} />
      <div style={{ position: "absolute", width: 360, height: 360, bottom: -120, left: 80, borderRadius: "50%", background: "#a7f3d0", opacity: 0.5, filter: "blur(70px)", pointerEvents: "none" }} />
      <div style={{ position: "absolute", width: 300, height: 300, top: 260, left: -100, borderRadius: "50%", background: "#fde68a", opacity: 0.4, filter: "blur(70px)", pointerEvents: "none" }} />

      <div style={{ position: "relative", height: "100%", display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 20px", zIndex: 30 }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, color: "#1e293b" }}>Protocolo:</div>
          <select value={protocolKey}
            onChange={(e) => {
              const key = e.target.value;
              setProtocolKey(key);
              setGraph(PROTOCOLS[key].seed());
              setSelectedId(null);
              setPan({ x: 220, y: 40 });
              setCustomLabel(null);
              setDraftId(null);
              setDraftTitle(key === "novo" ? "Rascunho sem título" : PROTOCOLS[key].label + " (cópia)");
            }}
            style={{ fontSize: 13, fontWeight: 700, color: "#1e293b", background: "rgba(255,255,255,0.75)", border: "1px solid rgba(255,255,255,0.85)", borderRadius: 10, padding: "6px 10px", cursor: "pointer", outline: "none" }}>
            {Object.entries(PROTOCOLS).map(([key, p]) => <option key={key} value={key}>{p.label}</option>)}
          </select>
          <button onClick={() => { setAiOpen(true); setAiError(null); }}
            style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 700, color: "#fff", border: "none", borderRadius: 999,
              padding: "8px 14px", cursor: "pointer", background: "linear-gradient(135deg,#c084fc,#7c3aed)", boxShadow: "0 4px 14px rgba(124,58,237,0.35)" }}>
            ✨ Gerar com IA
          </button>
          <input value={draftTitle} onChange={(e) => setDraftTitle(e.target.value)}
            placeholder="Título do rascunho"
            style={{ fontSize: 12.5, fontWeight: 600, color: "#1e293b", background: "rgba(255,255,255,0.75)",
              border: "1px solid rgba(255,255,255,0.85)", borderRadius: 10, padding: "7px 10px", outline: "none", width: 170 }} />
          <button onClick={handleSalvarRascunho} disabled={saving}
            style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 700, color: "#1e293b",
              border: "1px solid rgba(255,255,255,0.85)", borderRadius: 999, padding: "8px 14px",
              cursor: saving ? "default" : "pointer", background: "rgba(255,255,255,0.75)" }}>
            {saving ? "Salvando…" : draftId ? "💾 Atualizar" : "💾 Salvar rascunho"}
          </button>
          <button onClick={handleAbrirRascunhos}
            style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, fontWeight: 700, color: "#1e293b",
              border: "1px solid rgba(255,255,255,0.85)", borderRadius: 999, padding: "8px 14px",
              cursor: "pointer", background: "rgba(255,255,255,0.75)" }}>
            📂 Meus rascunhos
          </button>
          {saveError && (
            <div style={{ fontSize: 11.5, fontWeight: 600, color: "#dc2626", background: "rgba(254,242,242,0.9)", border: "1px solid rgba(220,38,38,0.25)", borderRadius: 999, padding: "5px 10px" }}>
              {saveError}
            </div>
          )}
          {rascunhosOpen && (
            <div style={{ position: "absolute", top: 54, left: 20, zIndex: 60, minWidth: 260, maxHeight: 320, overflowY: "auto",
              background: "#fff", borderRadius: 14, boxShadow: "0 10px 30px rgba(0,0,0,0.18)", border: "1px solid #e5e7eb", padding: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 6px 8px" }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: "#475569" }}>Meus rascunhos</span>
                <button onClick={() => setRascunhosOpen(false)} style={{ border: "none", background: "none", cursor: "pointer", color: "#94a3b8" }}><X size={14} /></button>
              </div>
              {rascunhosLoading && <div style={{ fontSize: 12, color: "#94a3b8", padding: 8 }}>Carregando…</div>}
              {!rascunhosLoading && rascunhos.length === 0 && <div style={{ fontSize: 12, color: "#94a3b8", padding: 8 }}>Nenhum rascunho salvo ainda.</div>}
              {!rascunhosLoading && rascunhos.map((r) => (
                <button key={r.id} onClick={() => handleCarregarRascunho(r.id)}
                  style={{ display: "block", width: "100%", textAlign: "left", border: "none", background: "none", cursor: "pointer",
                    padding: "8px 6px", borderRadius: 8, fontSize: 12.5, fontWeight: 600, color: "#1e293b" }}
                  onMouseEnter={(e) => e.currentTarget.style.background = "#f1f5f9"}
                  onMouseLeave={(e) => e.currentTarget.style.background = "none"}>
                  {r.titulo}
                  <div style={{ fontSize: 10.5, fontWeight: 500, color: "#94a3b8" }}>{new Date(r.updated_at).toLocaleString("pt-BR")}</div>
                </button>
              ))}
            </div>
          )}
          {customLabel && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, color: "#7c3aed", background: "rgba(245,243,255,0.9)", border: "1px solid rgba(124,58,237,0.25)", borderRadius: 999, padding: "5px 10px" }}>
              {customLabel}
              <button onClick={() => setCustomLabel(null)} style={{ border: "none", background: "none", color: "#a78bfa", cursor: "pointer", fontSize: 12, lineHeight: 1, padding: 0 }}>×</button>
            </div>
          )}
          <div style={{ flex: 1 }} />
          <div style={{ display: "flex", ...glass({ borderRadius: 999, padding: 4, boxShadow: "0 2px 8px rgba(100,90,140,0.1)" }), gap: 2 }}>
            {[{ id: "proximidade", label: "Por proximidade" }, { id: "temporal", label: "Por lapso (dias)" }].map((m) => (
              <button key={m.id} onClick={() => applyLayout(m.id)}
                style={{ padding: "6px 14px", borderRadius: 999, border: "none", fontSize: 12, fontWeight: 600, cursor: "pointer",
                  background: layoutMode === m.id ? "#fff" : "transparent", color: layoutMode === m.id ? "#7c3aed" : "#64748b",
                  boxShadow: layoutMode === m.id ? "0 2px 6px rgba(0,0,0,.08)" : "none", transition: "all .15s" }}>
                {m.label}
              </button>
            ))}
          </div>
        </div>

        <div style={{ flex: 1, display: "flex", position: "relative", overflow: "hidden" }}>
          <div ref={canvasRef} data-canvas-bg="1" onDrop={handleCanvasDrop} onDragOver={handleCanvasDragOver} onMouseDown={onCanvasMouseDown}
            style={{ flex: 1, position: "relative", overflow: "hidden", cursor: panningRef.current ? "grabbing" : "grab",
              backgroundImage: "radial-gradient(#d6d3ea 1.4px, transparent 1.4px)", backgroundSize: "24px 24px",
              backgroundPosition: `${pan.x % 24}px ${pan.y % 24}px` }}>

            {/* Camada de fundo da barra lateral — deixa claro que ela é fixa na tela,
                separada do canvas, mesmo se algum card acabar posicionado atrás dela. */}
            <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: 116, zIndex: 19, pointerEvents: "none",
              background: "linear-gradient(90deg, rgba(248,250,252,0.9) 55%, rgba(248,250,252,0) 100%)" }} />

            <div style={{ position: "absolute", left: 20, top: 24, zIndex: 20, display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>
              {graph.nodes.length === 0 && (
                <div style={{ position: "absolute", left: 62, top: 4, width: 168, fontSize: 11, fontWeight: 600, color: "#64748b", lineHeight: 1.35, pointerEvents: "none" }}>
                  Clique ou arraste um ícone pra adicionar um nó ao protocolo
                </div>
              )}
              {RAIL_ITEMS.map((item, i) => {
                const s = TYPE_STYLE[item.type];
                return (
                  <FloatingButton key={item.type} item={item} style={s} offset={i % 2 ? 10 : 0} size={54} iconSize={36}
                    onDragStart={(e) => { e.dataTransfer.setData("application/x-protocol-node", JSON.stringify(item)); setIsDraggingNode(true); }}
                    onDragEnd={() => { setIsDraggingNode(false); setOverTrash(false); }}
                    onClick={() => addFromRail(item.type)} />
                );
              })}
              <div style={{ width: 24, height: 1, background: "rgba(100,116,139,0.35)", margin: "2px 0" }} />
              {RAIL_ADVANCED.map((item) => {
                const s = TYPE_STYLE[item.type];
                return (
                  <FloatingButton key={item.type} item={item} style={s} offset={0} size={42} iconSize={28} muted
                    onDragStart={(e) => { e.dataTransfer.setData("application/x-protocol-node", JSON.stringify(item)); setIsDraggingNode(true); }}
                    onDragEnd={() => { setIsDraggingNode(false); setOverTrash(false); }}
                    onClick={() => addFromRail(item.type)} />
                );
              })}
            </div>

            <div data-canvas-bg="1" style={{ position: "absolute", left: pan.x, top: pan.y, width: 4000, height: 4000 }}>
              <svg data-canvas-bg="1" width={4000} height={4000} style={{ position: "absolute", left: 0, top: 0, pointerEvents: "none" }}>
                {graph.edges.map((e) => {
                  const from = nodesById[e.from], to = nodesById[e.to];
                  if (!from || !to) return null;
                  const anchor = outputAnchors(from).find((a) => a.id === e.fromHandle) || outputAnchors(from)[0];
                  const target = inputAnchor(to, e.id, graph.edges);
                  const color = TYPE_STYLE[from.type]?.accent || "#94a3b8";
                  const related = selectedId && (e.from === selectedId || e.to === selectedId);
                  const dimmed = selectedId && !related;
                  return <g key={e.id}><path d={edgePath(anchor.x, anchor.y, target.x, target.y)} stroke={color} strokeWidth={related ? 3.5 : 2.5} fill="none" opacity={dimmed ? 0.12 : related ? 1 : 0.75} strokeLinecap="round" /><circle cx={target.x} cy={target.y} r={related ? 5 : 4} fill={color} opacity={dimmed ? 0.12 : 1} /></g>;
                })}
                {connecting && cursorPos && (() => {
                  const from = nodesById[connecting.from]; if (!from) return null;
                  const anchor = outputAnchors(from).find((a) => a.id === connecting.fromHandle) || outputAnchors(from)[0];
                  return <path d={edgePath(anchor.x, anchor.y, cursorPos.x, cursorPos.y)} stroke={TYPE_STYLE[from.type].accent} strokeWidth={2.5} strokeDasharray="6 5" fill="none" opacity={0.9} />;
                })()}
              </svg>

              {graph.edges.map((e) => {
                const from = nodesById[e.from], to = nodesById[e.to];
                if (!from || !to) return null;
                const anchor = outputAnchors(from).find((a) => a.id === e.fromHandle) || outputAnchors(from)[0];
                const target = inputAnchor(to, e.id, graph.edges);
                const midX = (anchor.x + target.x) / 2, midY = (anchor.y + target.y) / 2;
                const related = selectedId && (e.from === selectedId || e.to === selectedId);
                const dimmed = selectedId && !related;
                return (
                  <div key={e.id + "-badge"} style={{ position: "absolute", left: midX - 42, top: midY - 13, width: 84, zIndex: 10, opacity: dimmed ? 0.2 : 1, transition: "opacity .15s",
                    display: "flex", justifyContent: "center", alignItems: "center", gap: 4, ...glass({ borderRadius: 999, padding: "3px 6px", border: related ? "1.5px solid rgba(37,99,235,0.5)" : "1px solid rgba(255,255,255,0.85)" }) }}>
                    <input type="number" min={0} value={e.lapso} onChange={(ev) => updateEdge(e.id, { lapso: Number(ev.target.value) })}
                      style={{ width: 34, fontSize: 11, textAlign: "center", background: "transparent", border: "none", outline: "none", color: "#334155", fontWeight: 600 }} title="Lapso em dias" />
                    <span style={{ fontSize: 9, color: "#94a3b8" }}>dias</span>
                    <button onClick={() => removeEdge(e.id)} style={{ border: "none", background: "none", color: "#fb7185", fontSize: 12, cursor: "pointer", lineHeight: 1, padding: 0 }}>×</button>
                  </div>
                );
              })}

              {graph.nodes.map((node) => {
                const s = TYPE_STYLE[node.type];
                const isSelected = selectedId === node.id;
                const isHovered = hoveredId === node.id && connecting && connecting.from !== node.id;
                const highlight = isSelected || isHovered;
                return (
                  <div key={node.id} data-node-id={node.id} onMouseDown={(e) => onNodeMouseDown(e, node)}
                    onMouseEnter={() => setHoveredId(node.id)} onMouseLeave={() => setHoveredId((h) => (h === node.id ? null : h))}
                    onClick={() => setSelectedId(node.id)}
                    style={{ position: "absolute", left: node.x, top: node.y, width: NODE_W, borderRadius: 20, zIndex: isSelected ? 10 : 2,
                      cursor: dragRef.current?.id === node.id ? "grabbing" : "grab", userSelect: "none",
                      ...glass({ border: highlight ? `1.5px solid ${s.accent}` : "1px solid rgba(255,255,255,0.85)", boxShadow: highlight ? `0 0 0 3px ${s.soft}, 0 8px 20px rgba(100,90,140,0.16)` : "0 8px 20px rgba(100,90,140,0.12)" }) }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 10px", borderBottom: "1px solid rgba(226,232,240,0.7)" }}>
                      <div style={{ width: 28, height: 28, borderRadius: "50%", background: s.grad, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: "inset 0 1px 2px rgba(255,255,255,0.4)" }}>
                        <s.Icon size={14} color="#fff" strokeWidth={2.3} />
                      </div>
                      <div style={{ minWidth: 0, flex: 1 }}>
                        <div style={{ fontSize: 11.5, fontWeight: 700, color: "#1e293b", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{node.name}</div>
                        {(node.type === "Exame" || node.type === "Medicamento") && (
                          <div style={{ fontSize: 9, fontWeight: 600, color: node.tussId || node.substanciaId ? "#059669" : "#d97706" }}>
                            {node.tussId || node.substanciaId ? "✓ vinculado ao catálogo" : "⚠ sem vínculo"}
                          </div>
                        )}
                      </div>
                      <button data-nocard-drag="1" onClick={(ev) => { ev.stopPropagation(); removeNode(node.id); }} style={{ border: "none", background: "transparent", color: "#cbd5e1", cursor: "pointer", padding: 2, display: "flex" }}>
                        <X size={13} />
                      </button>
                    </div>

                    {node.type === "Condicao" ? (
                      <div style={{ padding: "8px 10px", fontSize: 10, color: "#92400e", lineHeight: 1.5 }}>
                        {node.branches.map((b, i) => <div key={b.id}><b>{i + 1}.</b> {branchSummary(b, nodesById)}</div>)}
                      </div>
                    ) : node.type === "Admissao" ? (
                      <div style={{ padding: "8px 10px", fontSize: 10, color: "#0f766e", lineHeight: 1.5 }}>
                        {clauseChainSummary(node.clauses, nodesById)}
                      </div>
                    ) : node.type === "Evento" ? (
                      <div style={{ padding: "8px 10px", fontSize: 10.5, color: "#9f1239" }}>
                        {eventoResumo(node, nodesById)}
                      </div>
                    ) : (
                      <div style={{ padding: "8px 10px", fontSize: 10.5, color: "#64748b" }}>
                        Lapso: <b>{(() => { const l = displayLapso(node, graph.edges); return l === null ? "varia por conexão" : `${l}d`; })()}</b>
                      </div>
                    )}

                    <NodeCorners node={node} s={s} connecting={connecting} snapTarget={snapTarget}
                      hoveredArrow={hoveredArrow} setHoveredArrow={setHoveredArrow} startConnection={startConnection} />
                  </div>
                );
              })}
            </div>

      {aiOpen && (

          <div onClick={(e) => e.stopPropagation()} style={{ width: 520, maxWidth: "100%", ...glass({ borderRadius: 24, padding: 22, boxShadow: "0 24px 60px rgba(15,23,42,0.35)" }) }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <div style={{ width: 34, height: 34, borderRadius: "50%", background: "linear-gradient(135deg,#c084fc,#7c3aed)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>✨</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#1e293b" }}>Gerar fluxo com IA</div>
            </div>
            <div style={{ fontSize: 11.5, color: "#64748b", marginBottom: 14, lineHeight: 1.5 }}>
              Cole o texto de um protocolo (ou um trecho dele), anexe um PDF, ou os dois. A IA monta o fluxo completo — exames, condições, medicamentos, ramificações e exceções — pra você refinar depois.
              <br /><b>Até ~40 nós</b>: protocolos maiores que isso podem sair truncados ou pedir uma segunda passada de ajuste.
            </div>
            <textarea value={aiText} onChange={(e) => setAiText(e.target.value)} disabled={aiLoading}
              placeholder="Cole aqui o texto do protocolo (opcional se anexar PDF)..."
              style={{ width: "100%", minHeight: 130, fontSize: 12.5, padding: 12, borderRadius: 12, border: "1px solid #dbe1ea", boxSizing: "border-box", resize: "vertical", fontFamily: "inherit", outline: "none", marginBottom: 10 }} />

                <div style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 12, fontWeight: 600, color: "#1e293b", background: "#f1f5f9", borderRadius: 999, padding: "6px 12px" }}>
                  📄 {aiPdfFile.name}
                  <button onClick={() => setAiPdfFile(null)} disabled={aiLoading}
                    style={{ border: "none", background: "none", color: "#94a3b8", cursor: aiLoading ? "default" : "pointer", fontSize: 14, lineHeight: 1, padding: 0 }}>×</button>
                </div>

                <label style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12, fontWeight: 600, color: "#7c3aed", cursor: aiLoading ? "default" : "pointer", background: "#f5f3ff", borderRadius: 999, padding: "6px 12px" }}>
                  📎 Anexar PDF
                  <input type="file" accept="application/pdf" disabled={aiLoading} style={{ display: "none" }}
                    onChange={(e) => { handleAiPdfSelect(e.target.files?.[0]); e.target.value = ""; }} />
