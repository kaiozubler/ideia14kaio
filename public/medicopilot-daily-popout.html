<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamada de vídeo</title>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1220;color:#e2e8f0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #call{position:fixed;inset:0}
    #status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1220;z-index:3;text-align:center;padding:24px;font-size:14px;line-height:1.45}
    .err{color:#fca5a5}.muted{opacity:.72;font-size:12px;margin-top:8px}
  </style>
</head>
<body>
  <div id="call"></div>
  <div id="status">Preparando chamada…</div>
  <script>
    let callFrame=null;
    const statusEl=document.getElementById('status');
    function showStatus(message, error){
      if(!message){statusEl.style.display='none';statusEl.innerHTML='';return;}
      statusEl.style.display='flex';
      statusEl.innerHTML='<div class="'+(error?'err':'')+'">'+message+'</div>';
    }
    function notify(type, payload){
      try{ if(window.opener) window.opener.postMessage({source:'medicopilot-daily-popout',type,payload}, window.location.origin); }catch{}
    }
    function getEventText(ev){
      return (ev && (ev.text || (ev.rawResponse && ev.rawResponse.channel && ev.rawResponse.channel.alternatives && ev.rawResponse.channel.alternatives[0] && ev.rawResponse.channel.alternatives[0].transcript)) || '').trim();
    }
    window.__meetingState=function(){try{return callFrame && callFrame.meetingState ? callFrame.meetingState() : 'loading';}catch{return 'loading';}};
    window.__transcriptionState=function(){try{return callFrame && callFrame.transcriptionState ? callFrame.transcriptionState() : {isTranscribing:false};}catch{return {isTranscribing:false};}};
    window.__startTranscription=function(options){
      if(!callFrame) return Promise.reject(new Error('Chamada ainda não carregou'));
      return callFrame.startTranscription(options);
    };
    window.__stopTranscription=function(){
      if(!callFrame) return Promise.resolve();
      return callFrame.stopTranscription();
    };
    window.__closeDaily=async function(){
      try{ if(callFrame){ await callFrame.stopTranscription(); } }catch{}
      try{ if(callFrame){ await callFrame.leave(); } }catch{}
      try{ if(callFrame){ await callFrame.destroy(); } }catch{}
      callFrame=null;
      window.close();
    };
    window.__startDaily=async function(room, userName){
      showStatus('Carregando vídeo…');
      if(!window.DailyIframe) throw new Error('SDK do Daily não carregou');
      const container=document.getElementById('call');
      container.innerHTML='';
      callFrame=window.DailyIframe.createFrame(container, {
        url:room.url,
        token:room.token,
        userName:userName || 'Profissional',
        showUserNameChangeUI:false,
        lang:'pt-BR',
        showLeaveButton:true,
        showFullscreenButton:true,
        iframeStyle:{position:'absolute',inset:'0',width:'100%',height:'100%',border:'0'}
      });
      const iframe=container.querySelector('iframe');
      if(iframe){
        iframe.allow='camera; microphone; autoplay; display-capture; fullscreen; screen-wake-lock';
        iframe.setAttribute('allowfullscreen','true');
      }
      callFrame.on('joined-meeting',ev=>{showStatus(null);notify('joined-meeting',ev);});
      callFrame.on('left-meeting',ev=>{notify('left-meeting',ev);});
      callFrame.on('error',ev=>{showStatus('Erro na chamada<br><div class="muted">'+String((ev&&(ev.errorMsg||ev.error||ev.message))||'erro Daily')+'</div>',true);notify('error',ev);});
      callFrame.on('transcription-started',ev=>notify('transcription-started',ev));
      callFrame.on('transcription-stopped',ev=>notify('transcription-stopped',ev));
      callFrame.on('transcription-error',ev=>notify('transcription-error',ev));
      callFrame.on('transcription-message',ev=>{ if(getEventText(ev)) notify('transcription-message',ev); });
      try{
        await callFrame.join({url:room.url,token:room.token,userName:userName || 'Profissional'});
      }catch(err){
        showStatus('Falha ao entrar na sala<br><div class="muted">'+String((err&&err.message)||err)+'</div>',true);
        notify('error',{message:(err&&err.message)||String(err)});
        throw err;
      }
    };
    window.addEventListener('beforeunload',()=>notify('left-meeting',{}));
  </script>
</body>
</html>
